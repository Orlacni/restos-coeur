<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion du planning - Administration</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="/images/logo.png" alt="Restos du Cœur" onerror="this.style.display='none'">
                <h2>Restos du Cœur</h2>
            </div>
            <nav class="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <div class="nav-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="top-bar">
                <button class="menu-toggle" onclick="toggleMobileMenu()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="profile-menu">
                    <div class="profile-avatar" onclick="toggleProfileMenu()">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="dropdown-item" id="userName">Chargement...</div>
                        <div class="dropdown-item" id="userEmail" style="font-size: 0.8rem; color: var(--text-secondary);"></div>
                        <div class="dropdown-divider"></div>
                        <a href="/profil.html" class="dropdown-item">
                            <i class="fas fa-user-circle"></i> Mon profil
                        </a>
                        <div class="dropdown-item">
                            <i class="fas fa-moon"></i> Mode sombre
                            <label class="switch">
                                <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Déconnexion
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
                <h2>📅 Gestion du planning</h2>
                <button onclick="showAddCreneauModal()" style="background: var(--restos-rose);">➕ Ajouter un créneau</button>
            </div>
            
            <div id="creneaux-list" class="planning-container">
                <div class="loading">Chargement...</div>
            </div>
        </div>
        </div>
    </div>
    
    <script src="/js/layout.js"></script>
</body>
</html>
