<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribution - Restos du Cœur</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ===== STYLES ===== */
        .campagne-selector {
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .campagne-selector .form-group {
            margin-bottom: 0;
            flex: 1;
            min-width: 180px;
        }
        .btn-calculer {
            background: var(--restos-rose);
            color: white;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }
        .btn-calculer:hover { opacity: 0.9; }

        .alert-box {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }
        .alert-box.success {
            background: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .alert-box.info {
            background: #d1ecf1;
            color: #0c5460;
            border-color: #bee5eb;
        }

        .repartition-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            background: var(--bg-primary);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            font-size: 0.85rem;
        }
        .repartition-table th,
        .repartition-table td {
            padding: 0.5rem 0.7rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .repartition-table th {
            background: var(--restos-rose);
            color: white;
            font-weight: 600;
            white-space: nowrap;
        }
        .repartition-table td.qty,
        .repartition-table th.qty {
            text-align: center;
        }
        .repartition-table td.total {
            font-weight: 700;
            text-align: center;
        }
        .repartition-table tbody tr:nth-child(even) {
            background: var(--bg-tertiary);
        }
        .repartition-table tbody tr:last-child td {
            border-bottom: none;
        }
        .repartition-table .total-row {
            font-weight: 700;
            background: var(--bg-tertiary);
        }

        .badge-min {
            font-size: 0.6rem;
            background: #dc3545;
            color: white;
            border-radius: 10px;
            padding: 0.05rem 0.5rem;
            margin-left: 0.3rem;
            white-space: nowrap;
        }
        .badge-paquet {
            font-size: 0.6rem;
            background: #ffc107;
            color: #333;
            border-radius: 10px;
            padding: 0.05rem 0.5rem;
            margin-left: 0.3rem;
            white-space: nowrap;
        }

        .recap-points {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.75rem;
            margin: 1rem 0;
        }
        .recap-points-card {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--restos-rose);
        }
        .recap-points-card .groupe-label {
            font-weight: 600;
            font-size: 0.85rem;
        }
        .recap-points-card .pts {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .recap-points-card .ok { color: #28a745; }
        .recap-points-card .warn { color: #dc3545; }
        .recap-points-card .sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .emplacements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 1.5rem;
            margin: 1rem 0;
        }
        .emplacement-card {
            background: var(--bg-primary);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--restos-rose);
        }
        .emplacement-card h3 {
            color: var(--restos-rose);
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }
        .emplacement-card .repartition-table {
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }
        .emplacement-card .repartition-table th,
        .emplacement-card .repartition-table td {
            padding: 0.3rem 0.5rem;
        }

        .btn-imprimer {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-imprimer:hover { opacity: 0.9; }

        .stock-restant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.75rem;
            margin: 1rem 0;
        }
        .stock-restant-card {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid #17a2b8;
        }
        .stock-restant-card .nom {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .stock-restant-card .qty {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--restos-rose);
        }
        .stock-restant-card .sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            background: var(--bg-primary);
            border-radius: 16px;
        }
        .date-badge {
            background: var(--restos-rose);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .distribution-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .recap-points { grid-template-columns: 1fr 1fr; }
            .stock-restant-grid { grid-template-columns: 1fr 1fr; }
            .emplacements-grid { grid-template-columns: 1fr; }
            .campagne-selector { flex-direction: column; align-items: flex-start; }
        }

        #feuille-impression { display: none; }
        @media print {
            .sidebar, .top-bar, .campagne-selector, .btn-calculer, .btn-imprimer, .menu-toggle { display: none !important; }
            #distribution-content, #feuille-impression.hors-impression { display: none !important; }
            #feuille-impression.impression-active { display: block !important; }
            .main-content { margin: 0 !important; padding: 0 !important; }
        }
        .feuille-produit-ligne {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px solid #ddd;
            font-size: 1rem;
        }
        .feuille-titre {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        #progressModal .modal-content {
            max-width: 400px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="/images/logo.png" alt="Restos du Cœur" onerror="this.style.display='none'">
                <h2>Restos du Cœur</h2>
            </div>
            <nav class="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <div class="nav-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <button class="menu-toggle" onclick="toggleMobileMenu()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="profile-menu">
                    <div class="profile-avatar" onclick="toggleProfileMenu()">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="dropdown-item" id="userName">Chargement...</div>
                        <div class="dropdown-item" id="userEmail" style="font-size:0.8rem;color:var(--text-secondary);"></div>
                        <div class="dropdown-divider"></div>
                        <a href="/profil.html" class="dropdown-item"><i class="fas fa-user-circle"></i> Mon profil</a>
                        <div class="dropdown-item">
                            <i class="fas fa-moon"></i> Mode sombre
                            <label class="switch">
                                <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Déconnexion
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>🍽️ Préparation des distributions</h2>

                <div class="campagne-selector">
                    <div class="form-group">
                        <label>📅 Campagne</label>
                        <select id="campagneSelect" class="form-control">
                            <option value="">-- Sélectionner --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🚚 Livraisons du</label>
                        <select id="dateDebut" class="form-control">
                            <option value="">-- Sélectionner --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>au</label>
                        <select id="dateFin" class="form-control">
                            <option value="">-- Sélectionner --</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:0;">
                        <button class="btn-calculer" onclick="calculerRepartition()">
                            <i class="fas fa-calculator"></i> Calculer
                        </button>
                    </div>
                </div>

                <div id="distribution-content">
                    <div class="empty-state">
                        <i class="fas fa-calendar-alt" style="font-size:2rem;margin-bottom:1rem;"></i>
                        <p>Sélectionnez une campagne et une période puis cliquez sur "Calculer"</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="feuille-impression" class="hors-impression"></div>

    <div id="progressModal" class="modal">
        <div class="modal-content">
            <h2>Chargement...</h2>
            <div id="progressStatus">Calcul des besoins...</div>
        </div>
    </div>

    <script src="/js/layout.js"></script>
    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const MARGE_MAX_DEPASSEMENT = 2;

        const CATEGORIES = [
            { key: 'protides', label: '🥩 Protides' },
            { key: 'accompagnement', label: '🥕 Accompagnement' },
            { key: 'laitier', label: '🥛 Laitier' },
            { key: 'dessert', label: '🍰 Dessert' }
        ];

        var campagnes = [];
        var produits = [];
        var emplacements = [];
        var dernierResultat = null;

        // ============================================================
        // FONCTIONS UTILES
        // ============================================================
        function pointsCibles(nbAdultes) {
            return nbAdultes <= 1 ? 12 : nbAdultes * 10;
        }

        function arrondi(n) {
            return Math.round((n + Number.EPSILON) * 100) / 100;
        }

        function calculerPaquetRepas(pointsParUnite) {
            if (pointsParUnite <= 0) return 1;
            if (pointsParUnite >= 1) return 1;
            return Math.ceil(1 / pointsParUnite);
        }

        function getEmplacementNom(id) {
            if (!id) return 'Emplacement non défini';
            var e = emplacements.find(function(e) { return e.id == id; });
            return e ? e.nom : 'Emplacement non défini';
        }

        // ============================================================
        // CHARGEMENT DES DONNÉES
        // ============================================================
        async function loadCampagnes() {
            var r = await fetch('/api/campagnes');
            campagnes = await r.json();
            var select = document.getElementById('campagneSelect');
            campagnes.forEach(function(c) {
                select.innerHTML += `<option value="${c.id}">${c.annee} - ${c.saison}</option>`;
            });
        }

        async function loadProduitsEtEmplacements() {
            var [rP, rE] = await Promise.all([
                fetch('/api/produits'),
                fetch('/api/emplacements')
            ]);
            produits = await rP.json();
            emplacements = await rE.json();
        }

        async function loadDatesLivraisons() {
            var r = await fetch('/api/livraisons');
            var parDate = await r.json();
            var dates = Object.keys(parDate).sort().reverse();

            var selectDebut = document.getElementById('dateDebut');
            var selectFin = document.getElementById('dateFin');

            var options = '<option value="">-- Sélectionner --</option>';
            dates.forEach(function(d) {
                var count = parDate[d].length;
                var formatted = new Date(d).toLocaleDateString('fr-FR');
                options += `<option value="${d}">📅 ${formatted} (${count} produit${count > 1 ? 's' : ''})</option>`;
            });

            selectDebut.innerHTML = options;
            selectFin.innerHTML = options;

            if (dates.length > 0) {
                selectFin.value = dates[0];
                selectDebut.value = dates[dates.length - 1];
            }
        }

        // ============================================================
        // MAPPING DES CATÉGORIES
        // ============================================================
        var GROUPE_VERS_CATEGORIE = {
            'PROTIDIQUE': 'protides',
            'ACCOMPAGNEMENT': 'accompagnement',
            'LAITIER': 'laitier',
            'DESSERT': 'dessert'
        };
        var CATEGORIE_MIXTE = 'accompagnement';

        function categoriesDuProduit(produit) {
            var pointsTotal = parseFloat(produit.points_total) || 0;
            if (pointsTotal <= 0) return [];
            if ((produit.groupe || '').toUpperCase() === 'MIXTE') {
                return [{ categorie: CATEGORIE_MIXTE, pointsParUnite: pointsTotal }];
            }
            var cat = GROUPE_VERS_CATEGORIE[(produit.groupe || '').toUpperCase()];
            if (!cat) return [];
            return [{ categorie: cat, pointsParUnite: pointsTotal }];
        }

        // ============================================================
        // RÉCUPÉRATION DU STOCK PAR PÉRIODE
        // ============================================================
        async function getStockPeriode(dateDebut, dateFin) {
    var r = await fetch('/api/livraisons');
    var parDate = await r.json();

    var stock = {};
    var infos = {};
    var dates = Object.keys(parDate);

    for (var i = 0; i < dates.length; i++) {
        var d = dates[i];
        if (dateDebut && d < dateDebut) continue;
        if (dateFin && d > dateFin) continue;
        var livraisonsJour = parDate[d];
        for (var j = 0; j < livraisonsJour.length; j++) {
            var l = livraisonsJour[j];
            var pid = l.produit_id;
            if (!pid) continue;
            stock[pid] = (stock[pid] || 0) + (parseFloat(l.total_a_distribuer) || 0);
            infos[pid] = { 
                nom: l.produit || pid, 
                reference: '',
                emplacement_id: l.emplacement_id || null // Récupération de l'emplacement
            };
        }
    }
    return { stock: stock, infos: infos };
}

        // ============================================================
        // ALGORITHME DE DISTRIBUTION
        // ============================================================
        function distribuerProduits(famillesParGroupe, produitsDisponibles) {
            var groupes = Object.keys(famillesParGroupe).map(Number).sort(function(a, b) { return a - b; });

            var stockRestant = {};
            produitsDisponibles.forEach(function(p) {
                stockRestant[p.id] = p.stock;
            });

            var distribution = {};
            groupes.forEach(function(taille) {
                distribution[taille] = {};
                produitsDisponibles.forEach(function(p) {
                    distribution[taille][p.id] = 0;
                });
            });

            var pointsParGroupe = {};
            groupes.forEach(function(taille) {
                pointsParGroupe[taille] = {};
                CATEGORIES.forEach(function(cat) {
                    pointsParGroupe[taille][cat.key] = 0;
                });
            });

            var groupesTries = groupes.slice().sort(function(a, b) { return b - a; });

            var produitsParCategorie = {};
            produitsDisponibles.forEach(function(p) {
                var cat = p.categorie || 'autres';
                if (!produitsParCategorie[cat]) produitsParCategorie[cat] = [];
                produitsParCategorie[cat].push(p);
            });

            // ============================================================
            // POUR CHAQUE CATÉGORIE
            // ============================================================
            CATEGORIES.forEach(function(cat) {
                var produitsCat = produitsParCategorie[cat.key] || [];
                if (produitsCat.length === 0) return;

                var produitsAvecPaquet = produitsCat.map(function(produit) {
                    var pts = produit.points_total || 0;
                    var paquetSize = calculerPaquetRepas(pts);
                    return {
                        produit: produit,
                        paquetSize: paquetSize,
                        pointsParPaquet: arrondi(pts * paquetSize)
                    };
                });

                // --- ÉTAPE 1 : Distribution initiale (1 paquet par famille) ---
                produitsAvecPaquet.forEach(function(pp) {
                    var produit = pp.produit;
                    var paquetSize = pp.paquetSize;
                    var pointsParPaquet = pp.pointsParPaquet;
                    var totalFamilles = 0;
                    Object.keys(famillesParGroupe).forEach(function(taille) {
                        totalFamilles += famillesParGroupe[taille];
                    });

                    var stock = stockRestant[produit.id] || 0;
                    var minParPersonne = produit.min_par_personne || false;
                    var besoinTotal = totalFamilles * paquetSize;

                    if (stock >= besoinTotal) {
                        Object.keys(famillesParGroupe).forEach(function(taille) {
                            var nbFamilles = famillesParGroupe[taille];
                            var qtyParFamille = paquetSize;

                            if (minParPersonne) {
                                qtyParFamille = parseInt(taille) * paquetSize;
                            }

                            var besoinGroupe = qtyParFamille * nbFamilles;

                            if (stockRestant[produit.id] >= besoinGroupe) {
                                distribution[taille][produit.id] += qtyParFamille;
                                stockRestant[produit.id] -= besoinGroupe;
                                pointsParGroupe[taille][cat.key] += (qtyParFamille / paquetSize) * pointsParPaquet;
                            }
                        });
                    }
                });

                // --- ÉTAPE 2 : Distribution prioritaire (grandes familles) ---
                produitsAvecPaquet.forEach(function(pp) {
                    var produit = pp.produit;
                    var paquetSize = pp.paquetSize;
                    var pointsParPaquet = pp.pointsParPaquet;
                    var stock = stockRestant[produit.id] || 0;
                    if (stock <= 0) return;

                    var minParPersonne = produit.min_par_personne || false;

                    if (minParPersonne) {
                        for (var gi = 0; gi < groupesTries.length; gi++) {
                            var taille = groupesTries[gi];
                            if (stock <= 0) break;

                            var nbFamilles = famillesParGroupe[taille];
                            var besoinParFamille = parseInt(taille) * paquetSize;
                            var besoinTotal = besoinParFamille * nbFamilles;

                            if (stock >= besoinTotal) {
                                distribution[taille][produit.id] += besoinParFamille;
                                stock -= besoinTotal;
                                pointsParGroupe[taille][cat.key] += (besoinParFamille / paquetSize) * pointsParPaquet;
                            } else {
                                var famillesServies = Math.floor(stock / besoinParFamille);
                                if (famillesServies > 0) {
                                    var totalUtilise = famillesServies * besoinParFamille;
                                    distribution[taille][produit.id] += besoinParFamille;
                                    stock -= totalUtilise;
                                    pointsParGroupe[taille][cat.key] += (besoinParFamille / paquetSize) * pointsParPaquet;
                                }
                                break;
                            }
                        }
                    } else {
                        for (var gi2 = 0; gi2 < groupesTries.length; gi2++) {
                            var taille2 = groupesTries[gi2];
                            if (stock <= 0) break;

                            var nbFamilles2 = famillesParGroupe[taille2];
                            var besoinTotal2 = nbFamilles2 * paquetSize;

                            if (stock >= besoinTotal2) {
                                distribution[taille2][produit.id] += paquetSize;
                                stock -= besoinTotal2;
                                pointsParGroupe[taille2][cat.key] += pointsParPaquet;
                            } else {
                                var famillesServies2 = Math.floor(stock / paquetSize);
                                if (famillesServies2 > 0) {
                                    var totalUtilise2 = famillesServies2 * paquetSize;
                                    distribution[taille2][produit.id] += paquetSize;
                                    stock -= totalUtilise2;
                                    pointsParGroupe[taille2][cat.key] += pointsParPaquet;
                                }
                                break;
                            }
                        }
                    }

                    stockRestant[produit.id] = stock;
                });

                // --- ÉTAPE 3 : Distribution en boucle (pour les petits points) ---
                var stockDisponible = true;
                var maxTours = 100;
                var tour = 0;

                var groupeAtteint = {};
                groupes.forEach(function(taille) {
                    groupeAtteint[taille] = false;
                });

                while (stockDisponible && tour < maxTours) {
                    stockDisponible = false;
                    tour++;

                    produitsAvecPaquet.forEach(function(pp) {
                        var produit = pp.produit;
                        var paquetSize = pp.paquetSize;
                        var pointsParPaquet = pp.pointsParPaquet;
                        var stock = stockRestant[produit.id] || 0;

                        if (stock <= 0) return;

                        var minParPersonne = produit.min_par_personne || false;

                        for (var gi3 = 0; gi3 < groupesTries.length; gi3++) {
                            var taille3 = groupesTries[gi3];
                            if (groupeAtteint[taille3]) continue;
                            if (stock <= 0) break;

                            var nbFamilles3 = famillesParGroupe[taille3];
                            var cible = pointsCibles(taille3);
                            var actuel = pointsParGroupe[taille3][cat.key];

                            if (actuel >= cible) {
                                groupeAtteint[taille3] = true;
                                continue;
                            }

                            var qtyParFamille = paquetSize;
                            if (minParPersonne) {
                                qtyParFamille = parseInt(taille3) * paquetSize;
                            }

                            var besoinGroupe = qtyParFamille * nbFamilles3;

                            if (stock >= besoinGroupe) {
                                distribution[taille3][produit.id] += qtyParFamille;
                                stock -= besoinGroupe;
                                pointsParGroupe[taille3][cat.key] += (qtyParFamille / paquetSize) * pointsParPaquet;
                                stockDisponible = true;

                                if (pointsParGroupe[taille3][cat.key] >= cible) {
                                    groupeAtteint[taille3] = true;
                                }
                            } else {
                                var famillesServies3 = Math.floor(stock / qtyParFamille);
                                if (famillesServies3 > 0) {
                                    var totalUtilise3 = famillesServies3 * qtyParFamille;
                                    distribution[taille3][produit.id] += qtyParFamille;
                                    stock -= totalUtilise3;
                                    pointsParGroupe[taille3][cat.key] += (qtyParFamille / paquetSize) * pointsParPaquet;
                                    stockDisponible = true;

                                    if (pointsParGroupe[taille3][cat.key] >= cible) {
                                        groupeAtteint[taille3] = true;
                                    }
                                }
                            }
                        }

                        stockRestant[produit.id] = stock;
                    });

                    var tousAtteints = true;
                    groupes.forEach(function(taille) {
                        if (!groupeAtteint[taille]) tousAtteints = false;
                    });

                    if (tousAtteints) break;
                }

                // --- ÉTAPE 4 : Ajustement des dépassements ---
                var ajustementsEffectues = true;
                var maxIterations = 100;
                var iter = 0;

                while (ajustementsEffectues && iter < maxIterations) {
                    ajustementsEffectues = false;
                    iter++;

                    for (var gi4 = 0; gi4 < groupes.length; gi4++) {
                        var taille4 = groupes[gi4];
                        var cible = pointsCibles(taille4);
                        var actuel = pointsParGroupe[taille4][cat.key];

                        if (actuel > cible + MARGE_MAX_DEPASSEMENT) {
                            var produitCher = null;
                            var maxPoints = 0;

                            produitsAvecPaquet.forEach(function(pp) {
                                var qty = distribution[taille4][pp.produit.id] || 0;
                                if (qty > 0) {
                                    var pts = pp.pointsParPaquet;
                                    if (pts > maxPoints) {
                                        maxPoints = pts;
                                        produitCher = pp;
                                    }
                                }
                            });

                            if (produitCher) {
                                var qtyActuelle = distribution[taille4][produitCher.produit.id] || 0;
                                var paquetSize = produitCher.paquetSize;
                                if (qtyActuelle >= paquetSize) {
                                    distribution[taille4][produitCher.produit.id] = qtyActuelle - paquetSize;
                                    pointsParGroupe[taille4][cat.key] -= produitCher.pointsParPaquet;
                                    stockRestant[produitCher.produit.id] = (stockRestant[produitCher.produit.id] || 0) + paquetSize;
                                    ajustementsEffectues = true;
                                }
                            }
                        }
                    }
                }
            });

            return {
                distribution: distribution,
                pointsParGroupe: pointsParGroupe,
                stockRestant: stockRestant,
                groupes: groupes,
                famillesParGroupe: famillesParGroupe,
                produitsDisponibles: produitsDisponibles
            };
        }

        // ============================================================
        // IMPRESSION PAR EMPLACEMENT
        // ============================================================
        function imprimerEmplacement(empId) {
            if (!dernierResultat) {
                alert('Aucun résultat à imprimer. Calculez d\'abord la distribution.');
                return;
            }

            var data = dernierResultat;

            var produitsEmp = data.produitsDisponibles.filter(function(p) {
                return (p.emplacement_id || 'inconnu') == empId;
            });

            if (produitsEmp.length === 0) {
                alert('Aucun produit pour cet emplacement.');
                return;
            }

            var nomEmp = empId === 'inconnu' ? 'Emplacement non défini' : getEmplacementNom(empId);

            var html = '<div style="padding:2rem;font-family:Arial,sans-serif;max-width:1200px;margin:0 auto;">';
            html += `<div style="text-align:center;margin-bottom:2rem;">`;
            html += `<h1 style="color:#d52b4b;margin:0;">Restos du Cœur</h1>`;
            html += `<h2 style="margin:0.25rem 0;font-size:1.2rem;">📍 Feuille de préparation - ${nomEmp}</h2>`;
            html += `<p style="color:#666;font-size:0.85rem;margin:0;">Campagne ${data.campagne ? data.campagne.annee + ' - ' + data.campagne.saison : ''}</p>`;
            html += `<p style="color:#666;font-size:0.85rem;margin:0;">Date: ${new Date().toLocaleDateString('fr-FR')}</p>`;
            html += '</div>';

            html += '<table style="width:100%;border-collapse:collapse;font-size:0.9rem;">';
            html += '<thead>';
            html += '<tr style="background:#d52b4b;color:white;">';
            html += '<th style="padding:0.5rem 0.7rem;text-align:left;">Produit</th>';
            data.groupes.forEach(function(taille) {
                html += `<th style="padding:0.5rem 0.7rem;text-align:center;">${taille}</th>`;
            });
            html += '<th style="padding:0.5rem 0.7rem;text-align:center;">Total</th>';
            html += '</tr>';
            html += '</thead>';

            html += '<tbody>';
            produitsEmp.forEach(function(p) {
                html += '<tr>';
                html += `<td style="padding:0.4rem 0.7rem;border-bottom:1px solid #ddd;">${p.nom}`;
                if (p.min_par_personne) html += ' ⚠️ min 1/pers';
                html += `</td>`;

                var totalProduit = 0;
                data.groupes.forEach(function(taille) {
                    var qty = data.distribution[taille][p.id] || 0;
                    totalProduit += qty;
                    html += `<td style="padding:0.4rem 0.7rem;text-align:center;border-bottom:1px solid #ddd;">${qty > 0 ? qty : '—'}</td>`;
                });
                html += `<td style="padding:0.4rem 0.7rem;text-align:center;border-bottom:1px solid #ddd;font-weight:700;">${totalProduit}</td>`;
                html += '</tr>';
            });

            html += '<tr style="font-weight:700;background:#f5f5f5;">';
            html += `<td style="padding:0.4rem 0.7rem;">Total</td>`;
            data.groupes.forEach(function(taille) {
                var totalEmp = 0;
                produitsEmp.forEach(function(p) {
                    totalEmp += data.distribution[taille][p.id] || 0;
                });
                html += `<td style="padding:0.4rem 0.7rem;text-align:center;">${totalEmp}</td>`;
            });
            var totalEmpGeneral = 0;
            produitsEmp.forEach(function(p) {
                data.groupes.forEach(function(taille) {
                    totalEmpGeneral += data.distribution[taille][p.id] || 0;
                });
            });
            html += `<td style="padding:0.4rem 0.7rem;text-align:center;">${totalEmpGeneral}</td>`;
            html += '</tr>';

            html += '</tbody></table>';
            html += '</div>';

            var win = window.open('', '_blank', 'width=1200,height=800');
            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>Feuille de préparation - ${nomEmp}</title>
                    <style>
                        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
                        .no-print { display: none; }
                        @media print {
                            .no-print { display: none !important; }
                            table { page-break-inside: avoid; }
                        }
                    </style>
                </head>
                <body>
                    ${html}
                    <div class="no-print" style="text-align:center;padding:1rem;position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid #ddd;">
                        <button onclick="window.print()" style="padding:0.5rem 2rem;background:#d52b4b;color:white;border:none;border-radius:8px;cursor:pointer;font-size:1rem;">🖨️ Imprimer</button>
                        <button onclick="window.close()" style="padding:0.5rem 2rem;background:#666;color:white;border:none;border-radius:8px;cursor:pointer;font-size:1rem;margin-left:0.5rem;">Fermer</button>
                    </div>
                </body>
                </html>
            `);
            win.document.close();
        }

        // ============================================================
        // AFFICHAGE DES RÉSULTATS
        // ============================================================
        function afficherResultats(data) {
            var container = document.getElementById('distribution-content');
            var html = '';

            var totalFamilles = 0;
            Object.keys(data.famillesParGroupe).forEach(function(t) {
                totalFamilles += data.famillesParGroupe[t];
            });

            html += '<div class="distribution-header">';
            html += `<div><span class="date-badge">🚚 Livraison sélectionnée</span>`;
            html += `<span style="margin-left:1rem;">👨‍👩‍👧‍👦 ${totalFamilles} familles</span></div>`;
            html += '</div>';

            // ============================================================
            // RÉSUMÉ GLOBAL PAR CATÉGORIE
            // ============================================================
            html += '<h3>📊 Résumé global par catégorie</h3>';
            html += '<div class="recap-points">';

            CATEGORIES.forEach(function(cat) {
                var totalDistribue = 0;
                var totalObjectif = 0;

                data.groupes.forEach(function(taille) {
                    var t = parseInt(taille);
                    var nbFamilles = data.famillesParGroupe[t];
                    var cible = pointsCibles(t);
                    var actuel = data.pointsParGroupe[t][cat.key] || 0;

                    totalDistribue += actuel * nbFamilles;
                    totalObjectif += cible * nbFamilles;
                });

                var ecart = arrondi(totalDistribue - totalObjectif);
                var pct = totalObjectif > 0 ? Math.round((totalDistribue / totalObjectif) * 100) : 0;
                var ok = Math.abs(ecart) <= 5;
                var pctColor = pct >= 100 ? '#28a745' : (pct >= 70 ? '#ffc107' : '#dc3545');

                html += `<div class="recap-points-card" style="border-left-color: ${pct >= 100 ? '#28a745' : '#dc3545'};">`;
                html += `<div class="groupe-label" style="font-size:1.1rem;">${cat.label}</div>`;
                html += `<div class="pts ${ok ? 'ok' : 'warn'}" style="font-size:1.6rem;">${arrondi(totalDistribue)} / ${totalObjectif} pts</div>`;
                html += `<div class="sub" style="color:${pctColor}; font-weight:bold; font-size:0.9rem;">${pct}% atteint (${ecart > 0 ? '+' : ''}${ecart} pts)</div>`;
                html += `<div class="sub">${ok ? '✅ Objectif global atteint' : '⚠️ Objectif global non atteint'}</div>`;
                html += `</div>`;
            });

            html += '</div>';

            // ============================================================
            // DÉTAIL DES QUANTITÉS PAR CATÉGORIE
            // ============================================================
            html += '<h3>📦 Détail des quantités distribuées par catégorie</h3>';

            var produitsParCategorie = {};
            data.produitsDisponibles.forEach(function(p) {
                var cat = p.categorie || 'autres';
                if (!produitsParCategorie[cat]) produitsParCategorie[cat] = [];
                produitsParCategorie[cat].push(p);
            });

            var labelsCategories = {
                'protides': '🥩 Protides',
                'accompagnement': '🥕 Accompagnement',
                'laitier': '🥛 Laitier',
                'dessert': '🍰 Dessert'
            };

            CATEGORIES.forEach(function(cat) {
                var produitsCat = produitsParCategorie[cat.key] || [];
                if (produitsCat.length === 0) {
                    html += `<h4 style="margin:1.5rem 0 0.5rem;">${cat.label}</h4>`;
                    html += `<div class="alert-box info">Aucun produit disponible</div>`;
                    return;
                }

                var label = labelsCategories[cat.key] || cat.key;
                html += `<h4 style="margin:1.5rem 0 0.5rem;">${label}</h4>`;
                html += '<div style="overflow-x:auto;">';
                html += '<table class="repartition-table">';

                html += '<thead><tr>';
                html += '<th>Produit</th>';
                html += '<th class="qty">Pts/unité</th>';
                data.groupes.forEach(function(taille) {
                    var nbFamilles = data.famillesParGroupe[taille];
                    html += `<th class="qty">${taille} adulte${taille > 1 ? 's' : ''}<br><small>${nbFamilles} fam.</small></th>`;
                });
                html += '<th class="qty">Total<br><small>distribué / dispo</small></th>';
                html += '</tr></thead>';

                html += '<tbody>';
                var totalGeneral = 0;

                produitsCat.forEach(function(p) {
                    var pts = p.points_total || 0;
                    var paquetSize = calculerPaquetRepas(pts);
                    var stockInitial = p.stock;

                    html += '<tr>';
                    html += `<td>${p.nom}`;
                    if (p.min_par_personne) html += ` <span class="badge-min">min 1/pers</span>`;
                    if (paquetSize > 1) html += ` <span class="badge-paquet">${paquetSize} unités/repas</span>`;
                    html += `</td>`;
                    html += `<td class="qty">${p.points_total || 0}</td>`;

                    var totalProduit = 0;
                    data.groupes.forEach(function(taille) {
                        var qty = data.distribution[taille][p.id] || 0;
                        totalProduit += qty;
                        html += `<td class="qty">${qty > 0 ? qty : '-'}</td>`;
                    });

                    var restant = data.stockRestant[p.id] || 0;
                    var distribue = stockInitial - restant;
                    var pct = stockInitial > 0 ? Math.round((distribue / stockInitial) * 100) : 0;
                    var ratioColor = pct >= 100 ? 'color:#28a745;' : (pct >= 50 ? 'color:#ffc107;' : 'color:#dc3545;');

                    html += `<td class="total" style="${ratioColor}">${distribue} / ${stockInitial} (${pct}%)</td>`;
                    html += '</tr>';
                    totalGeneral += totalProduit;
                });

                html += `<tr class="total-row">`;
                html += `<td colspan="2">Total ${label}</td>`;
                data.groupes.forEach(function(taille) {
                    var totalCat = 0;
                    produitsCat.forEach(function(p) {
                        totalCat += data.distribution[taille][p.id] || 0;
                    });
                    html += `<td class="qty">${totalCat}</td>`;
                });
                html += `<td class="total">${totalGeneral}</td>`;
                html += '</tr>';

                html += '</tbody></table>';
                html += '</div>';
            });

            // ============================================================
            // FEUILLES PAR EMPLACEMENT
            // ============================================================
            html += '<h3>📍 Feuilles de préparation par emplacement</h3>';
            html += '<div class="emplacements-grid">';

            var produitsParEmplacement = {};
            data.produitsDisponibles.forEach(function(p) {
                var empId = p.emplacement_id || 'inconnu';
                if (!produitsParEmplacement[empId]) produitsParEmplacement[empId] = [];
                produitsParEmplacement[empId].push(p);
            });

            Object.keys(produitsParEmplacement).forEach(function(empId) {
                var produitsEmp = produitsParEmplacement[empId];
                var nomEmp = empId === 'inconnu' ? '❓ Emplacement non défini' : getEmplacementNom(empId);

                html += `<div class="emplacement-card">`;
                html += `<h3>📍 ${nomEmp}</h3>`;
                html += '<div style="overflow-x:auto;">';
                html += '<table class="repartition-table">';

                html += '<thead><tr>';
                html += '<th>Produit</th>';
                data.groupes.forEach(function(taille) {
                    html += `<th class="qty">${taille}</th>`;
                });
                html += '<th class="qty">Total</th>';
                html += '</tr></thead>';

                html += '<tbody>';
                produitsEmp.forEach(function(p) {
                    var pts = p.points_total || 0;
                    var paquetSize = calculerPaquetRepas(pts);

                    html += '<tr>';
                    html += `<td>${p.nom}`;
                    if (p.min_par_personne) html += ` <span class="badge-min">min 1/pers</span>`;
                    if (paquetSize > 1) html += ` <span class="badge-paquet">${paquetSize} u./repas</span>`;
                    html += `</td>`;

                    var totalProduit = 0;
                    data.groupes.forEach(function(taille) {
                        var qty = data.distribution[taille][p.id] || 0;
                        totalProduit += qty;
                        html += `<td class="qty">${qty > 0 ? qty : '—'}</td>`;
                    });

                    html += `<td class="total">${totalProduit}</td>`;
                    html += '</tr>';
                });

                html += `<tr class="total-row">`;
                html += `<td><strong>Total</strong></td>`;
                data.groupes.forEach(function(taille) {
                    var totalEmp = 0;
                    produitsEmp.forEach(function(p) {
                        totalEmp += data.distribution[taille][p.id] || 0;
                    });
                    html += `<td class="qty"><strong>${totalEmp}</strong></td>`;
                });
                var totalEmpGeneral = 0;
                produitsEmp.forEach(function(p) {
                    data.groupes.forEach(function(taille) {
                        totalEmpGeneral += data.distribution[taille][p.id] || 0;
                    });
                });
                html += `<td class="total"><strong>${totalEmpGeneral}</strong></td>`;
                html += '</tr>';

                html += '</tbody></table>';
                html += '</div>';

                html += `<button class="btn-imprimer" onclick="imprimerEmplacement('${empId}')">`;
                html += `<i class="fas fa-print"></i> Imprimer`;
                html += '</button>';
                html += '</div>';
            });

            html += '</div>';

            // ============================================================
            // STOCK RESTANT
            // ============================================================
            html += '<h3>📦 Stock restant</h3>';
            html += '<div class="stock-restant-grid">';

            var stockRestantTotal = 0;
            data.produitsDisponibles.forEach(function(p) {
                var restant = data.stockRestant[p.id] || 0;
                if (restant > 0) {
                    stockRestantTotal += restant;
                    var pts = p.points_total || 0;
                    var paquetSize = calculerPaquetRepas(pts);
                    var repasRestants = Math.floor((restant / paquetSize) * (pts * paquetSize));

                    html += `<div class="stock-restant-card">`;
                    html += `<div class="nom">${p.nom}</div>`;
                    html += `<div class="qty">${restant} unités</div>`;
                    html += `<div class="sub">${arrondi(restant * pts)} pts - ${repasRestants} repas</div>`;
                    html += `</div>`;
                }
            });

            if (stockRestantTotal === 0) {
                html += '<div class="empty-state" style="grid-column:1/-1;">✅ Tout le stock a été distribué !</div>';
            }
            html += '</div>';

            container.innerHTML = html;
        }

        // ============================================================
        // CALCUL PRINCIPAL
        // ============================================================
        async function calculerRepartition() {
            var campagneId = document.getElementById('campagneSelect').value;
            if (!campagneId) {
                alert('Merci de sélectionner une campagne.');
                return;
            }

            var dateDebut = document.getElementById('dateDebut').value;
            var dateFin = document.getElementById('dateFin').value;
            if (!dateDebut || !dateFin) {
                alert('Merci de sélectionner une période de livraisons.');
                return;
            }

            var progressModal = document.getElementById('progressModal');
            progressModal.style.display = 'block';

            try {
                if (produits.length === 0) {
                    await loadProduitsEtEmplacements();
                }

                var [rFamillesReponse, stockInfo] = await Promise.all([
                    fetch('/api/familles/' + campagneId).then(function(r) { return r.json(); }),
                    getStockPeriode(dateDebut, dateFin)
                ]);

                var rFamilles;
                if (Array.isArray(rFamillesReponse)) {
                    rFamilles = rFamillesReponse;
                } else if (rFamillesReponse && Array.isArray(rFamillesReponse.familles)) {
                    rFamilles = rFamillesReponse.familles;
                } else {
                    throw new Error('Erreur API /api/familles');
                }

                var famillesParGroupe = {};
                for (var i = 0; i < rFamilles.length; i++) {
                    var nb = parseInt(rFamilles[i].nb_adultes) || 1;
                    famillesParGroupe[nb] = (famillesParGroupe[nb] || 0) + 1;
                }

                var produitsDisponibles = [];
                for (var j = 0; j < produits.length; j++) {
                    var p = produits[j];
                    var stock = stockInfo.stock[p.id] || 0;
                    if (stock > 0) {
                        var cats = categoriesDuProduit(p);
                        if (cats.length > 0) {
                            produitsDisponibles.push({
    id: p.id,
    nom: p.nom,
    points_total: parseFloat(p.points_total) || 0,
    portions_par_unite: parseInt(p.portions_par_unite) || 1,
    min_par_personne: !!p.min_par_personne,
    stock: stock,
    emplacement_id: stockInfo.infos[p.id] ? stockInfo.infos[p.id].emplacement_id : null, // Récupéré depuis la livraison
    categorie: cats[0].categorie
});
                        }
                    }
                }

                if (Object.keys(famillesParGroupe).length === 0) {
                    document.getElementById('distribution-content').innerHTML =
                        '<div class="empty-state">Aucune famille enregistrée pour cette campagne.</div>';
                    progressModal.style.display = 'none';
                    return;
                }

                if (produitsDisponibles.length === 0) {
                    document.getElementById('distribution-content').innerHTML =
                        '<div class="empty-state">Aucun produit disponible dans les livraisons sélectionnées.</div>';
                    progressModal.style.display = 'none';
                    return;
                }

                var resultat = distribuerProduits(famillesParGroupe, produitsDisponibles);
                resultat.campagne = campagnes.find(function(c) { return c.id == campagneId; });
                resultat.dateDebut = dateDebut;
                resultat.dateFin = dateFin;

                dernierResultat = resultat;
                afficherResultats(resultat);

            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('distribution-content').innerHTML =
                    `<div class="empty-state">❌ Erreur: ${error.message || 'erreur inconnue'}</div>`;
            } finally {
                progressModal.style.display = 'none';
            }
        }

        // ============================================================
        // INITIALISATION
        // ============================================================
        loadCampagnes();
        loadProduitsEtEmplacements();
        loadDatesLivraisons();
    </script>
</body>
